{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} {{ label }}{% endblock %}
{% block page_title %}{{ 'Edit' if item else 'Add' }} {{ label }}{% endblock %}
{% block content %}
<div class="admin-card">
  <form method="post">
    <div class="form-group"><label>Title *</label><input type="text" name="title" class="form-control" value="{{ item.title if item else '' }}" required></div>
    <div class="form-group"><label>Content / Description</label><textarea name="content" class="form-control" rows="4">{{ item.content if item else '' }}</textarea></div>
    <div class="form-group"><label>Icon (optional Font Awesome class)</label><input type="text" name="icon" class="form-control" value="{{ item.icon if item else '' }}" placeholder="e.g. fa-star"></div>
    <div class="form-group"><label>Sort Order</label><input type="number" name="sort_order" class="form-control" value="{{ item.sort_order if item else 0 }}"></div>
    <div class="check-row"><input type="checkbox" name="is_active" id="act" {% if not item or item.is_active %}checked{% endif %}><label for="act">Active</label></div>
    <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Save</button>
    <a href="{{ url_for('admin.content_list', key=key) }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
