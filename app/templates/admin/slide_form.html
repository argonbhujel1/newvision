{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} Slide{% endblock %}
{% block page_title %}{{ 'Edit' if item else 'Add' }} Hero Slide{% endblock %}
{% block content %}
<div class="admin-card">
  <form method="post" enctype="multipart/form-data">
    <div class="form-group"><label>Title *</label><input type="text" name="title" class="form-control" value="{{ item.title if item else '' }}" required></div>
    <div class="form-group"><label>Subtitle</label><input type="text" name="subtitle" class="form-control" value="{{ item.subtitle if item else '' }}"></div>
    <div class="form-group"><label>Badge Text</label><input type="text" name="badge_text" class="form-control" value="{{ item.badge_text if item else '' }}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
      <div class="form-group"><label>Button 1 Text</label><input type="text" name="button1_text" class="form-control" value="{{ item.button1_text if item else '' }}"></div>
      <div class="form-group"><label>Button 1 URL</label><input type="text" name="button1_url" class="form-control" value="{{ item.button1_url if item else '' }}"></div>
      <div class="form-group"><label>Button 2 Text</label><input type="text" name="button2_text" class="form-control" value="{{ item.button2_text if item else '' }}"></div>
      <div class="form-group"><label>Button 2 URL</label><input type="text" name="button2_url" class="form-control" value="{{ item.button2_url if item else '' }}"></div>
    </div>
    <div class="form-group"><label>Sort Order</label><input type="number" name="sort_order" class="form-control" value="{{ item.sort_order if item else 0 }}"></div>
    <div class="form-group"><label>Image</label>
      {% if item and item.image_path %}<p><img src="{{ media_url(item.image_path) }}" style="height:80px;border-radius:8px;"></p>{% endif %}
      <input type="file" name="image" accept="image/*,.heic,.heif,image/heic,image/heif" class="form-control">
    </div>
    <div class="check-row"><input type="checkbox" name="is_active" id="is_active" {% if not item or item.is_active %}checked{% endif %}><label for="is_active">Active</label></div>
    <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Save</button>
    <a href="{{ url_for('admin.slides') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
